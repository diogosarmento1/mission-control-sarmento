<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control · Iniciar sessão</title>
<style>
  :root{--gold:#9c7c3c;--ink:#1a1a1a;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,'Avenir Next',sans-serif;background:#0e0e0e;color:#1a1a1a;}
  .card{background:#fff;padding:40px 36px;border-radius:10px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  h1{font-size:15px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 4px;color:var(--ink);}
  p.sub{margin:0 0 24px;font-size:13px;color:#777;}
  label{display:block;font-size:12px;color:#555;margin-bottom:6px;}
  input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:16px;}
  input:focus{outline:none;border-color:var(--gold);}
  button{width:100%;padding:11px;border:none;border-radius:6px;background:var(--ink);color:#fff;
    font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  button:hover{background:var(--gold);}
  .erro{background:#fbeaea;color:#9c3c3c;border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:16px;}
</style>
</head>
<body>
  <form class="card" method="POST" action="/api/login">
    <h1>Mission Control</h1>
    <p class="sub">Ourivesaria Sarmento</p>
    <div id="erroBox" class="erro" style="display:none;">Utilizador ou password incorretos.</div>
    <label for="username">Utilizador</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('erro') === '1') {
      document.getElementById('erroBox').style.display = 'block';
    }
  </script>
</body>
</html>
